    "lancedb>=0.30.2",
    "pyarrow>=18.0.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "rich>=14.3.2",
    "srsly>=2.5.2",
    "uvicorn>=0.40.0",
]
